<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemilihan Ketua & Wakil OSIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#36CBCB',
                        accent: '#FF7D00',
                        dark: '#1E293B',
                        light: '#F8FAFC'
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .card-shadow { box-shadow: 0 10px 30px rgba(22, 93, 255, 0.12); }
            .gradient-bg { background: linear-gradient(135deg, #165DFF 0%, #36CBCB 100%); }
            /* ✅ Tambahan agar teks pilihan terlihat jelas */
            select {
                color: #1E293B !important;
                background-color: #FFFFFF !important;
                font-size: 1rem !important;
            }
            select option {
                color: #1E293B !important;
                background-color: #FFFFFF !important;
                padding: 8px !important;
            }
            select:disabled {
                color: #64748B !important;
                background-color: #F1F5F9 !important;
            }
        }
    </style>
</head>
<body class="font-sans bg-slate-50 text-dark">

    <!-- Navbar -->
    <nav class="gradient-bg text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <img src="logo-mai-ok.png" alt="Nama Logo" width="25" height="40">
                <h1 class="text-xl font-bold">Pemilihan OSIS</h1>
            </div>
            <a href="hasil.html" class="bg-white/20 px-3 py-1 rounded-lg text-sm hover:bg-white/30">
                <i class="fa fa-bar-chart"></i> Lihat Hasil
            </a>
        </div>
    </nav>

    <!-- Bagian Login -->
    <section class="py-16 md:py-24 gradient-bg text-white">
        <div class="container mx-auto px-4">
            <div class="max-w-md mx-auto bg-white rounded-2xl p-8 card-shadow">
                <h2 class="text-2xl font-bold text-center text-primary mb-6">Masuk Pemilihan</h2>
                <form id="loginForm">
                    <div class="mb-4">
                        <label class="block font-medium text-slate-700 mb-2">Pilih Kelas</label>
                        <select id="kelas" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 text-slate-800 bg-white" required onchange="loadNamaSiswa()">
                            <option value="" disabled selected>-- Pilih Kelas --</option>
                            <option value="Kelas X.1">Kelas X.1</option>
                            <option value="Kelas X.2">Kelas X.2</option>
                            <option value="Kelas XI">Kelas XI</option>
                            <option value="Kelas XII.1">Kelas XII.1</option>
                            <option value="Kelas XII.2">Kelas XII.2</option>
                        </select>
                    </div>
                    <div class="mb-6">
                        <label class="block font-medium text-slate-700 mb-2">Pilih Nama Siswa</label>
                        <select id="nama" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 text-slate-800 bg-white" required disabled>
                            <option value="" disabled selected>-- Pilih Kelas Terlebih Dahulu --</option>
                        </select>
                    </div>
                    <div id="pesanError" class="text-red-500 text-sm mb-4 hidden"></div>
                    <button type="submit" class="w-full bg-primary text-white py-3 rounded-lg font-semibold hover:bg-primary/90 transition">
                        Masuk ke Pemilihan
                    </button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="gradient-bg text-white py-4 text-center text-sm">
        <p>© 2026 Taufiq Abdul Arief Robbani | Pemilihan OSIS MA Islamiyah Mundu Tahun Ajaran 2026/2027</p>
    </footer>

    <script>
        // Data Siswa per Kelas
        const dataSiswa = {
            "Kelas X.1": ["AGUNG LASMANA", "ALVIN WIJAYA", "AHMAD MAULANA", "ANA NI'MATUL ULAA", "ARYA SAPUTRA", "BUNGA SAFITRI", "DEA RATNA", "DIMAS ADITIA", "EDWARD FABIANO", "FAHRANI SALSABILA KURNIAWAN", "FIFIH NAILAH", "FUJIYANTI ARAFAH", "HALIMAH REGINA PUTRI", "KEYSA AGITA PUTRI", "MOH SAKU", "MUCHAROPI", "M. REZA", "REFA", "RENALDI SETIAWAN", "SAEPUL", "SUPRIYOGI", "SYIFAA KHOIRUNNISA", "UMU AIMAN", "VIDIYAH AYUNI", "WIDIA NINGSIH"],
            "Kelas X.2": ["ALENI", "AHMAD MAULUDDIN", "AKHMAD KAELANI", "ASYARA ADILLA KHANZA", "BENTAR AL HUSNA", "CHIKA RAMADHANI", "DZAKY ALMER JAMAIL", "ERIKA HAMID", "FAHAT DWI SAPUTRA", "FADHEA DWI VANNESA", "HAFIZAH NURUL AEINI", "HABIBUN NURULLAH", "KHOERUL AZAM", "KENANGA AFISTA", "MARIO FATAN DERMAWAN", "MUHAMAD DAVIN FERDIANSYAH", "MUHAMMAD ARIF AMIRUDDIN", "NUR AZIZAH", "NURHALIMAH", "PUTRI ANGGRAENI", "REZA", "RIFAT HIDAYAT", "SYAHPUTRA", "SELY RAHMADANI", "SAMIUN", "ZULFIKAR"],
            "Kelas XI": ["ABDUL HAMID", "AGUNG PRAMANA", "ANDIKA RIZKI PUTRA", "APRIYAN", "ASIYA", "DWI ANDIN JUANITA", "EFAN APRIANSYAH", "GALANG DWI PRATAMA", "HENGKI", "ILHAM NOOR FAMI", "MEGA MUSTIKA", "MOH ADILATUN", "MOH FAZRI AMRULLAH", "MOH. ARIF MAULANA", "MOH. MAULANA", "MOH. RIZAL", "MOHAMAD REVALDI", "MOHAMMAD FARID HUSEN", "MOHAMMAD SHOPIULLAH", "MUFLIKHA DWI WAHYUNI", "MUHAMAD ARSYADATUL UMAM", "MUHAMAD FADIL FADILLAH", "MUHAMMAD NUR ZAFIN", "MUHAMMAD SANDIH", "NATASYA RAMADHANTI", "NOVA ALFIANA", "RAMADAN", "RISKY MAULANA", "SEKAR KEMUNING", "SELVI", "SHERLY KHASANAH", "SITI AFNI AULIYAH", "SOLEHA WIDIA WATI", "SULAIMAN", "SYIFATURRAHMAWATI"],
            "Kelas XII.1": ["ADEL LITA", "ALHANA", "ALPIN MUBAROK", "ANDI IBRAHIM BAANGGA RAHAWARIN", "DIKI FIRMANSYAH", "FADLI FASHA SHAPUTRA", "GALIH VIJAR NUGRAHA", "IJJATUL HIMAH", "LIORY ATTALA PRIYANA", "MARSELA AURILIANI PUTRI", "MUHAMMAD IZARRUL AZHAR", "MUHAMMAD RIZQI ASHSHUBHI", "NAIF DERMAWAN", "NINA NATASYA", "NURUL AINI", "PUTRI NURITA", "SAEFUL MU'MIN AL MADANI", "SALMAH", "SITI FITRIYAH", "SUNADI", "TATIH AGUSTINA", "ZIDNI ILMAN"],
            "Kelas XII.2": ["AHMAD RIYANI", "ALDIANSYAH", "ANGGA", "ARMAN", "AULIA RAHMAWATI", "DAMAR ADIYASA", "GIO RAHMADHAN", "IMAN MAULANA", "LUVI SAHRUL", "MELISA", "MOHAMMAD AFIF MAULANA", "MOHAMMAD YASIN ARAFAT", "NABILA AZZALIA PUTRI", "NATASHA SAFFA AZAHRA", "NILA LESTARI", "NUR AZIZAH", "SAFIRA DEWI", "SEMI AJI DILAGA", "SITI RAHMA YANI", "SITI SHOLEHA", "SRI HAYATI", "SUCI SEPTIANI", "SUTA", "TIARA PUTRI FEBRIYANTI"]
        };

        // Isi daftar nama siswa berdasarkan kelas yang dipilih
        function loadNamaSiswa() {
            const kelasSelect = document.getElementById("kelas");
            const namaSelect = document.getElementById("nama");
            const selectedKelas = kelasSelect.value;
            namaSelect.innerHTML = '<option value="" disabled selected>-- Pilih Nama --</option>';
            namaSelect.disabled = true;
            if (selectedKelas && dataSiswa[selectedKelas]) {
                dataSiswa[selectedKelas].forEach(nama => {
                    const option = document.createElement("option");
                    option.value = nama;
                    option.textContent = nama;
                    namaSelect.appendChild(option);
                });
                namaSelect.disabled = false;
            }
        }

        // Saat form dikirim → simpan data & arahkan ke halaman pemilihan
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const kelas = document.getElementById("kelas").value;
            const nama = document.getElementById("nama").value;
            const pesan = document.getElementById("pesanError");

            if (!kelas || !nama) {
                pesan.textContent = "⚠️ Silakan pilih kelas dan nama terlebih dahulu!";
                pesan.classList.remove("hidden", "text-green-600");
                pesan.classList.add("text-red-500");
                return;
            }

            // Simpan data siswa agar bisa dipakai di halaman tujuan
            localStorage.setItem("namaSiswa", nama);
            localStorage.setItem("kelasSiswa", kelas);

            // ✅ Arahkan langsung ke halaman pemilihan
            window.location.href = "https://maimundu.github.io/pemilihan-osis-mai/pilih.html";
        });
    </script>
</body>
</html>
